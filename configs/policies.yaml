policies:
  # Reverse shell and suspicious command execution
  - name: detect-shell-exec
    type: exec
    description: "Shell execution; final verdict depends on workload intent and context"
    severity: HIGH
    match:
      file_contains:
        - /bash
        - /sh
    action: log

  - name: detect-netcat-reverse-shell
    type: exec
    description: "Netcat-style reverse shell tool execution"
    severity: CRITICAL
    match:
      file_contains:
        - /nc
        - /ncat
        - /netcat
    action: alert

  - name: detect-python-exec
    type: exec
    description: "Python execution can be used for reverse shells or post-exploitation"
    severity: HIGH
    match:
      file_contains:
        - /python
    action: alert

  # Sensitive files
  - name: deny-shadow-access
    type: open
    description: "Access to /etc/shadow"
    severity: CRITICAL
    match:
      path_contains:
        - /etc/shadow
    action: deny

  - name: deny-kcore-access
    type: open
    description: "Access to kernel memory via /proc/kcore"
    severity: CRITICAL
    match:
      path_contains:
        - /proc/kcore
    action: deny

  - name: deny-docker-sock-access
    type: open
    description: "Access to container runtime socket"
    severity: CRITICAL
    match:
      path_contains:
        - /var/run/docker.sock
        - /run/docker.sock
    action: deny

  - name: deny-core-pattern-write
    type: open
    description: "Write access to /proc/sys/kernel/core_pattern (CVE-2025-31133)"
    severity: CRITICAL
    match:
      path_contains:
        - /proc/sys/kernel/core_pattern
    action: kill

  # Container escape primitives
  - name: detect-mount-syscall
    type: mount
    description: "Mount operation from a monitored workload"
    severity: HIGH
    match: {}
    action: alert

  - name: detect-unshare-namespace
    type: unshare
    description: "Namespace unshare operation"
    severity: HIGH
    match: {}
    action: alert

  - name: detect-ptrace-abuse
    type: ptrace
    description: "Process tracing attempt"
    severity: HIGH
    match: {}
    action: alert
