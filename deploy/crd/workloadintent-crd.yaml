# WorkloadIntent CRD 정의
# "이 워크로드가 원래 이 행위를 해야 하는가?"를 선언하는 리소스
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workloadintents.patrol.ebpf.io
  annotations:
    patrol.ebpf.io/description: >
      WorkloadIntent declares the expected runtime behavior of a workload.
      The eBPF-PATROL agent matches pods via label selectors and enforces
      these behavioral contracts at the kernel level using eBPF.
spec:
  group: patrol.ebpf.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["selector"]
              properties:
                selector:
                  type: object
                  description: >
                    Label selector for matching pods. Only pods whose labels
                    satisfy ALL matchLabels AND matchExpressions are governed
                    by this WorkloadIntent.
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        required: ["key", "operator"]
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum: ["In", "NotIn", "Exists", "DoesNotExist"]
                          values:
                            type: array
                            items:
                              type: string
                namespaceSelector:
                  type: object
                  description: >
                    Optional namespace-level selector. When set, only pods in
                    namespaces matching these labels are considered.
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                # ─── 행위 허용 플래그 ───
                allowShell:
                  type: boolean
                  default: false
                  description: "Whether shell execution (sh/bash/dash/ash/zsh/ksh) is permitted."
                allowNamespaceOps:
                  type: boolean
                  default: false
                  description: "Whether namespace manipulation (unshare, setns, mount) is permitted."
                allowPrivilegeOps:
                  type: boolean
                  default: false
                  description: "Whether privileged operations (ptrace, CAP_SYS_ADMIN) are permitted."
                allowDockerSock:
                  type: boolean
                  default: false
                  description: "Whether access to container runtime sockets is permitted."
                # ─── 세밀한 제어 ───
                expectedProcesses:
                  type: array
                  items:
                    type: string
                  description: "List of process names that are expected inside this workload."
                allowedPaths:
                  type: object
                  properties:
                    read:
                      type: array
                      items:
                        type: string
                    write:
                      type: array
                      items:
                        type: string
                  description: "Filesystem path prefixes that the workload may access."
                # ─── 오탐 감소 제어 ───
                priority:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  default: 100
                  description: >
                    Higher priority wins when multiple WorkloadIntents match the
                    same pod. Prevents conflicting intents from causing false
                    positives.
                enforcementMode:
                  type: string
                  enum: ["enforce", "audit", "learn"]
                  default: "enforce"
                  description: >
                    enforce: actively block violations.
                    audit: log violations without blocking (zero false-positive risk).
                    learn: observe and build a behavioral baseline before enforcing.
                gracePeriodSeconds:
                  type: integer
                  minimum: 0
                  default: 30
                  description: >
                    Seconds after pod start during which violations are logged
                    but NOT blocked. This prevents false positives from
                    container startup noise (library loading, config reads, etc.)
                ttlSeconds:
                  type: integer
                  minimum: 0
                  default: 0
                  description: >
                    Auto-expire this intent after N seconds. 0 means no expiry.
                    Useful for debug/diagnostic pods that should have temporary
                    elevated permissions.
                requireApproval:
                  type: boolean
                  default: false
                  description: >
                    When true, the webhook requires an approval annotation
                    (patrol.ebpf.io/approved-by) on the pod before allowing
                    privileged operations.
                auditLevel:
                  type: string
                  enum: ["minimal", "standard", "verbose"]
                  default: "standard"
                  description: "Controls the verbosity of audit logs for matched workloads."
            status:
              type: object
              properties:
                matchedPods:
                  type: integer
                  description: "Number of running pods currently matched by this intent."
                materializedCgroups:
                  type: integer
                  description: "Number of cgroup IDs with injected intent flags."
                lastSyncTime:
                  type: string
                  format: date-time
                  description: "Last time the intent was synchronized to eBPF maps."
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.enforcementMode
          description: "Enforcement mode"
        - name: Shell
          type: boolean
          jsonPath: .spec.allowShell
          description: "Shell allowed"
        - name: NsOps
          type: boolean
          jsonPath: .spec.allowNamespaceOps
          description: "Namespace ops allowed"
        - name: Matched
          type: integer
          jsonPath: .status.matchedPods
          description: "Matched pods"
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: workloadintents
    singular: workloadintent
    kind: WorkloadIntent
    shortNames:
      - wi
      - wintent
    categories:
      - patrol
      - security
